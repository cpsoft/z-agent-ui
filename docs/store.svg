<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="门店照片（示意）">
  <!-- demo 用的占位门店图：手绘 SVG，避免引外部图片依赖 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2420"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a63"/>
      <stop offset="1" stop-color="#8d6a3f"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#wall)"/>
  <rect width="640" height="360" fill="url(#lamp)"/>

  <!-- 背景菜单板 -->
  <rect x="56" y="42" width="238" height="128" rx="6" fill="#0f0d0b" stroke="#3a322b" stroke-width="2"/>
  <g fill="#c9b79c" opacity="0.55">
    <rect x="74" y="62" width="118" height="8" rx="4"/>
    <rect x="74" y="84" width="182" height="6" rx="3"/>
    <rect x="74" y="100" width="160" height="6" rx="3"/>
    <rect x="74" y="116" width="172" height="6" rx="3"/>
    <rect x="74" y="138" width="96" height="6" rx="3"/>
  </g>

  <!-- 吊灯 -->
  <g>
    <line x1="404" y1="0" x2="404" y2="46" stroke="#4b4139" stroke-width="3"/>
    <path d="M370 46 h68 l-14 26 h-40 z" fill="#3b332c" stroke="#5a4f45" stroke-width="2"/>
    <circle cx="404" cy="76" r="7" fill="#ffe0ac" opacity="0.9"/>
  </g>

  <!-- 台面 -->
  <rect x="0" y="238" width="640" height="122" fill="url(#counter)"/>
  <rect x="0" y="238" width="640" height="10" fill="#e6c393" opacity="0.7"/>

  <!-- 咖啡机 -->
  <g>
    <rect x="452" y="146" width="132" height="92" rx="8" fill="#241f1b" stroke="#4a4038" stroke-width="2"/>
    <rect x="470" y="164" width="96" height="34" rx="4" fill="#3a322a"/>
    <rect x="486" y="206" width="64" height="24" rx="3" fill="#12100e"/>
    <circle cx="518" cy="218" r="6" fill="#f2e6d2" opacity="0.85"/>
  </g>

  <!-- 杯子一排 -->
  <g>
    <g fill="#f6efe4" stroke="#d9cdbb" stroke-width="2">
      <path d="M96 240 h44 l-5 46 h-34 z"/>
      <path d="M156 240 h44 l-5 46 h-34 z"/>
      <path d="M216 240 h44 l-5 46 h-34 z"/>
    </g>
    <g fill="#c98a4b" opacity="0.85">
      <ellipse cx="118" cy="252" rx="18" ry="6"/>
      <ellipse cx="178" cy="252" rx="18" ry="6"/>
      <ellipse cx="238" cy="252" rx="18" ry="6"/>
    </g>
  </g>

  <!-- 前景虚化：一杯成品 -->
  <g opacity="0.92">
    <path d="M330 262 h72 l-8 74 h-56 z" fill="#f7f1e6" stroke="#d9cdbb" stroke-width="2"/>
    <rect x="336" y="252" width="60" height="14" rx="3" fill="#2b2420"/>
    <rect x="330" y="292" width="72" height="10" fill="#b5783f" opacity="0.55"/>
  </g>

  <!-- 地面反光 -->
  <rect x="0" y="352" width="640" height="8" fill="#0e0c0a" opacity="0.5"/>
</svg>
